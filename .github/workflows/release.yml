name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) — no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show toolchain
        run: node --version && npm --version

      - name: Validate translations
        run: npm run check

      - name: Load the client bundle through a stand-in module loader
        run: npm run smoke

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
