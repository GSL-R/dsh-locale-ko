name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate translations against the schema baseline
        run: npm run check
      - name: Load client.js through a stand-in module loader
        run: npm run smoke
